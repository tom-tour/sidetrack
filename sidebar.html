<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="common/theme.css">
  <link rel="stylesheet" href="sidebar.css">
</head>
<body>
  <main id="main">
    <!-- Ligne du haut : les modes (onglets), puis 🌐 et ⚙ -->
    <div id="top">
      <div id="tabs" class="tabs">
        <button id="mode-listen" class="tab" data-i18n="modePlaylist"></button>
        <button id="mode-blind" class="tab" data-i18n="modeBlind" data-i18n-title="modeBlindTitle"></button>
        <!-- Hôte d'un salon seulement -->
        <button id="mode-emcee" class="tab" data-i18n="modeEmcee" data-i18n-title="modeEmceeTitle" hidden></button>
      </div>
      <button id="toggle-room" class="icon" data-i18n-title="room">🌐<span id="unread" class="badge over" hidden></span></button>
      <button id="open-settings" class="icon" data-i18n-title="settings">⚙</button>
    </div>
    <div id="notice" class="notice" hidden></div>
    <!-- Lecteur autorisé : « prêt » pendant 5 s, puis les premiers pas (OK / Ne plus afficher) -->
    <div id="ready" class="notice good" hidden>
      <span data-i18n="noticeReady"></span>
      <div class="actions"><button id="ready-ok" data-i18n="ok"></button></div>
    </div>
    <div id="tips" class="notice" hidden>
      <strong data-i18n="tipsTitle"></strong>
      <ul>
        <li id="tip-link" data-i18n="tipLink"></li>
        <li id="tip-presets" data-i18n="tipPresets"></li>
        <li id="tip-room" data-i18n="tipRoom"></li>
      </ul>
      <div class="actions">
        <button id="tips-ok" data-i18n="ok"></button>
        <button id="tips-never" data-i18n="dontShowAgain"></button>
      </div>
    </div>

    <!-- Salon (bouton 🌐) : créer ou rejoindre, salons publics ; une fois dedans, le chat -->
    <section id="online" hidden>
      <!-- Premier lancement : la preuve de travail de l'identité se calcule une seule fois -->
      <div id="mining" class="notice mining" hidden>
        <p id="mining-title" class="title"></p>
        <progress id="mining-bar" max="100"></progress>
        <p class="help" data-i18n="identityMiningHelp"></p>
      </div>
      <!-- Premier salon : choix du pseudo, tant qu'il n'a été ni choisi ni accepté -->
      <form id="name-ask" data-i18n-title="nameAsk" hidden>
        <label for="ask-name" data-i18n="nickname"></label>
        <input id="ask-name" type="text" maxlength="24" autocomplete="off">
        <button data-i18n="ok"></button>
      </form>
      <form id="room-form">
        <input id="room-name" type="text" data-i18n-placeholder="roomName" maxlength="24" autocomplete="off">
        <label data-i18n-title="publicRoomTitle"><input type="checkbox" id="room-public"> <span data-i18n="public"></span></label>
        <button type="submit" id="room-go"></button>
      </form>
      <div id="rooms-row">
        <span id="public-status" class="muted"></span>
        <button id="public-refresh" class="icon" data-i18n-title="refresh">↻</button>
      </div>
      <ul id="public-list"></ul>
      <div id="room-panel" hidden>
        <div id="room-head">
          <span><span data-i18n="room"></span> <strong id="room-code"></strong> <span id="room-public-badge" data-i18n-title="publicBadgeTitle">🌐</span></span>
          <span id="room-status" class="muted"></span>
          <button id="room-copy" data-i18n-title="copyLinkTitle"></button>
          <button id="room-close" class="icon" data-i18n-title="closeRoom">✕</button>
        </div>
        <div id="room-players" class="chips"></div>
        <!-- Fiche d'un joueur (clic sur son nom) : points, exclure, bannir -->
        <div id="person" class="card" hidden></div>
        <div id="chat" class="chat"></div>
        <form id="chat-form" class="chat-form">
          <button type="button" id="chat-secret" class="icon" hidden></button>
          <input id="chat-input" type="text" data-i18n-placeholder="chatPlaceholder" autocomplete="off" maxlength="500">
          <button type="submit" data-i18n="send"></button>
        </form>
      </div>
    </section>

    <!-- Onglet Playlist : choix de la playlist, playlists toutes prêtes, ajout d'un lien -->
    <div id="listen-head">
      <!-- Partie de blind test en cours pendant qu'on regarde les playlists -->
      <div id="game-banner" class="notice" hidden>
        <span id="game-banner-text"></span>
        <div class="actions">
          <button id="game-back" data-i18n="backToGame"></button>
          <button id="game-stop" data-i18n="stopGame"></button>
        </div>
      </div>
      <div id="pl-bar">
        <select id="pl-select" data-i18n-title="playlist"></select>
        <input id="pl-name" type="text" data-i18n-placeholder="playlistName" autocomplete="off" hidden>
        <button id="pl-new" class="icon" data-i18n-title="newPlaylist">＋</button>
        <button id="pl-rename" class="icon" data-i18n-title="rename">✎</button>
        <button id="pl-delete" class="icon" data-i18n-title="deletePlaylist">🗑</button>
        <button id="pl-export" class="icon" data-i18n-title="exportYoutube">⤴</button>
        <button id="pl-presets" class="icon" data-i18n-title="presets">📚</button>
      </div>
      <!-- Playlists toutes prêtes (bouton 📚) -->
      <div id="presets" hidden>
        <div id="preset-list"></div>
      </div>
      <form id="add">
        <input id="url" type="text" data-i18n-placeholder="linkPlaceholder" data-i18n-title="linkHelp" autocomplete="off">
        <button type="submit" data-i18n="add"></button>
      </form>
    </div>

    <!-- Onglet Blind test, entre deux parties : playlists jouées et réglages de la partie -->
    <div id="blind-setup" hidden>
      <div id="blind-pick">
        <p class="muted" data-i18n="blindSources"></p>
        <ul id="blind-sources"></ul>
      </div>
      <details id="blind-options">
        <summary id="blind-summary"></summary>
        <fieldset id="blind-settings" class="frame">
          <!-- Réglages tout faits : un clic règle tout le reste -->
          <div id="formulas">
            <button data-formula="express" data-i18n="formulaExpress" data-i18n-title="formulaExpressTitle"></button>
            <button data-formula="classic" data-i18n="formulaClassic" data-i18n-title="formulaClassicTitle"></button>
            <button data-formula="chapters" data-i18n="formulaChapters" data-i18n-title="formulaChaptersTitle"></button>
          </div>

          <p class="group" data-i18n="groupRounds"></p>
          <label><span data-i18n="rounds"></span>
            <select id="rounds">
              <option value="0" data-i18n="roundsAll"></option>
              <option value="5">5</option>
              <option value="10">10</option>
              <option value="15">15</option>
              <option value="20">20</option>
              <option value="30">30</option>
              <option value="50">50</option>
            </select>
          </label>
          <label><span data-i18n="startAt"></span>
            <select id="startMode">
              <option value="start" data-i18n="startBeginning"></option>
              <option value="random" data-i18n="startRandom"></option>
              <option value="chapter" data-i18n="startChapter"></option>
            </select>
          </label>
          <label><span data-i18n="clipLength"></span>
            <select id="clip">
              <option value="10">10 s</option>
              <option value="15">15 s</option>
              <option value="20">20 s</option>
              <option value="30">30 s</option>
              <option value="45">45 s</option>
              <option value="60">60 s</option>
              <option value="0" data-i18n="wholeTrack"></option>
              <option value="-1" data-i18n="chapterLength"></option>
            </select>
          </label>
          <label class="check" data-i18n-title="freshTitle"><input type="checkbox" id="fresh"> <span data-i18n="fresh"></span></label>

          <p class="group" data-i18n="groupDuring"></p>
          <label class="check"><input type="checkbox" id="hideVideo"> <span id="hideVideo-label"></span></label>
          <label class="check"><input type="checkbox" id="hints"> <span data-i18n="hints"></span></label>

          <p class="group" data-i18n="groupAfter"></p>
          <label><span data-i18n="pause"></span>
            <select id="pause">
              <option value="0" data-i18n="pauseManual"></option>
              <option value="5"></option>
              <option value="10"></option>
              <option value="15"></option>
              <option value="20"></option>
              <option value="30"></option>
            </select>
          </label>
          <!-- Blind test joué (seul ou dans un salon) -->
          <label id="judge-row"><span data-i18n="judge"></span>
            <select id="judge">
              <option value="chat" data-i18n="judgeChat"></option>
              <option value="self" data-i18n="judgeSelf"></option>
            </select>
          </label>
          <!-- Animateur seulement -->
          <label id="scoring-row" hidden><span data-i18n="scoring"></span>
            <select id="scoring">
              <option value="auto" data-i18n="scoringAuto"></option>
              <option value="manual" data-i18n="scoringManual"></option>
            </select>
          </label>
        </fieldset>
      </details>
    </div>

    <div id="stage">
      <!-- Aperçu (réglage, désactivé par défaut) : un clic affiche ou masque l'onglet, comme 📺 -->
      <div id="player-wrap" hidden>
        <img id="art" alt="" data-i18n-title="previewTitle" hidden>
        <div id="mask" hidden>
          <div id="mask-icon">?</div>
          <div id="mask-time"></div>
        </div>
        <div id="loading" hidden data-i18n-title="loadingVideoTitle"><div class="spinner"></div></div>
      </div>
      <div id="now"></div>
      <!-- Progression : la vidéo (un clic pour y aller), ou l'extrait d'une manche de blind test -->
      <div id="progress" hidden>
        <time id="pos-time"></time>
        <progress id="pos-bar"></progress>
        <time id="pos-total"></time>
      </div>
      <!-- Blind test : le titre se dévoile peu à peu -->
      <div id="hint" hidden><span id="hint-mask"></span> <span id="hint-max" class="muted"></span></div>
      <div id="volume-row">
        <label data-i18n-title="volume">🔊 <input type="range" id="volume" min="0" max="100"></label>
        <button id="show-player" class="icon" data-i18n-title="togglePlayerTitle">📺</button>
      </div>
    </div>

    <!-- Invité dans le salon de quelqu'un : c'est l'hôte qui choisit la musique -->
    <section id="guest" hidden>
      <div id="guest-status"></div>
      <div id="guest-claim" class="controls" hidden>
        <button id="guest-found" class="good" data-i18n="found"></button>
        <button id="guest-missed" class="bad" data-i18n="missed"></button>
      </div>
      <div id="guest-listen">
        <div class="line">
          <span class="muted grow" data-i18n="hostPlaylist"></span>
          <button id="share-moment" data-i18n="shareMoment" data-i18n-title="shareMomentTitle"></button>
        </div>
        <ol id="guest-queue"></ol>
      </div>
    </section>

    <section id="listen">
      <div class="controls">
        <button id="prev" data-i18n-title="prev">⏮</button>
        <button id="toggle" data-i18n-title="playPause">⏯</button>
        <button id="next" data-i18n-title="next">⏭</button>
        <button id="shuffle" data-i18n-title="shuffle">🔀</button>
      </div>
      <ol id="queue"></ol>
      <p id="empty" class="muted" data-i18n="emptyPlaylist" hidden></p>
    </section>

    <section id="blind" hidden>
      <div id="blind-status"></div>
      <div id="blind-actions" class="controls"></div>
      <!-- Seul, points à l'écrit : nos réponses de la manche -->
      <div id="solo-guess" hidden>
        <form id="guess-form" class="line">
          <input type="text" id="guess-input" data-i18n-placeholder="guessPlaceholder" autocomplete="off" maxlength="120">
          <button type="submit" data-i18n="send"></button>
        </form>
        <ul id="guess-list"></ul>
      </div>
      <!-- Fin de partie : les manches jouées, un clic pour réécouter -->
      <div id="recap" hidden>
        <p class="muted" data-i18n="recapTitle"></p>
        <ol id="recap-list"></ol>
      </div>
      <!-- Animateur : liste des pistes, clic = prochaine manche -->
      <div id="host-tracks" hidden>
        <div class="line">
          <span id="host-tracks-title" class="muted grow"></span>
          <button id="host-tracks-toggle"></button>
        </div>
        <ol id="host-queue"></ol>
      </div>
    </section>
  </main>

  <main id="settings" class="settings" hidden>
    <div class="line">
      <button id="close-settings" data-i18n="back"></button>
      <strong data-i18n="settings"></strong>
    </div>

    <fieldset>
      <legend data-i18n="general"></legend>
      <label><span data-i18n="language"></span>
        <select id="set-lang">
          <option value="auto" data-i18n="langAuto"></option>
          <option value="fr">Français</option>
          <option value="en">English</option>
        </select>
      </label>
      <label class="check"><input type="checkbox" id="set-chatSound"> <span data-i18n="chatSound"></span></label>
    </fieldset>

    <fieldset>
      <legend data-i18n="display"></legend>
      <label class="check"><input type="checkbox" id="set-showPresets"> <span data-i18n="showPresets"></span></label>
      <label class="check"><input type="checkbox" id="set-showTips"> <span data-i18n="showTips"></span></label>
      <label class="check"><input type="checkbox" id="set-showPreview"> <span data-i18n="showPreview"></span></label>
      <p class="help" data-i18n="showPreviewHelp"></p>
      <label class="check"><input type="checkbox" id="set-hideTab"> <span data-i18n="hideTab"></span></label>
      <p class="help" data-i18n="hideTabHelp"></p>
    </fieldset>

    <fieldset>
      <legend data-i18n="multiplayer"></legend>
      <label class="check"><input type="checkbox" id="set-showMulti"> <span data-i18n="showMulti"></span></label>
      <p class="help" data-i18n="showMultiHelp"></p>
    </fieldset>

    <!-- Sauvegarde des playlists dans un fichier, et restauration -->
    <fieldset>
      <legend data-i18n="backup"></legend>
      <p class="help" data-i18n="backupHelp"></p>
      <div class="line">
        <button id="backup-save" data-i18n="backupSave"></button>
        <button id="backup-restore" data-i18n="backupRestore"></button>
        <input type="file" id="backup-file" accept=".json,application/json" hidden>
      </div>
    </fieldset>

    <fieldset>
      <legend data-i18n="profile"></legend>
      <label><span data-i18n="nickname"></span>
        <input type="text" id="set-nickname" maxlength="24" autocomplete="off">
      </label>
      <p class="help" data-i18n="nicknameHelp"></p>
      <p><span data-i18n="codeLabel"></span> : <span id="my-code" class="code"></span></p>
      <p class="help" data-i18n="codeHelp"></p>
      <p class="help" data-i18n="ipNotice"></p>
    </fieldset>

    <fieldset>
      <legend data-i18n="blockedList"></legend>
      <ul id="blocked" class="list"></ul>
    </fieldset>

    <fieldset>
      <legend data-i18n="bannedList"></legend>
      <ul id="banned" class="list"></ul>
    </fieldset>

    <details>
      <summary data-i18n="log"></summary>
      <pre id="log" class="log"></pre>
    </details>

    <fieldset>
      <legend data-i18n="about"></legend>
      <p>Sidetrack <span id="version"></span></p>
      <p><a href="https://addons.mozilla.org/firefox/addon/sidetrack/" target="_blank" rel="noopener" data-i18n="amoPage"></a></p>
      <p><a href="https://github.com/tom-tour/sidetrack" target="_blank" rel="noopener" data-i18n="sourceCode"></a></p>
      <p><a href="https://ko-fi.com/tom_t" target="_blank" rel="noopener" data-i18n="support"></a></p>
    </fieldset>
  </main>

  <script src="common/i18n-core.js"></script>
  <script src="i18n.js"></script>
  <script src="common/ui.js"></script>
  <script src="presets.js"></script>
  <script src="sidebar.js"></script>
  <script src="sidebar-playlist.js"></script>
  <script src="sidebar-blind.js"></script>
  <script src="sidebar-room.js"></script>
</body>
</html>
