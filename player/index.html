<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sidetrack</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 16px system-ui, sans-serif; }
    #player { width: 100%; height: 100%; }
    #unlock {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(0, 0, 0, 0.85);
    }
    #unlock[hidden], #cover[hidden] { display: none; }
    /* Blind test : la vidéo reste cachée même si l'onglet est affiché (sous le bouton du son) */
    #cover {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #111; color: #fff; font-size: 96px; font-weight: 700;
    }
    #unlock .card { max-width: 520px; margin: 16px; padding: 24px 28px; border-radius: 12px; background: #1c1b22; color: #fbfbfe; }
    #unlock h1 { margin: 0 0 12px; font-size: 22px; }
    #unlock ol { margin: 0 0 20px; padding-left: 22px; line-height: 1.45; }
    #unlock li { margin: 8px 0; }
    #unlock li span { color: #a3a3ad; }
    #unlock button {
      display: block; width: 100%; font: inherit; font-size: 20px; padding: 14px 28px; cursor: pointer;
      color: #fff; background: #0061e0; border: 0; border-radius: 8px;
    }
    #unlock button:hover { background: #0250bb; }
    #unlock p { margin: 0 0 12px; line-height: 1.45; }
    #unlock .help { color: #a3a3ad; font-size: 14px; }
    #step-sound p { margin-bottom: 20px; }
    #unlock .choices { display: grid; gap: 8px; margin-top: 20px; }
    #unlock button.secondary { font-size: 16px; padding: 10px 20px; background: #2b2a33; }
    #unlock button.secondary:hover { background: #45444c; }
    #unlock .card[hidden] { display: none; }
  </style>
</head>
<body>
  <div id="player"></div>
  <div id="cover" hidden>?</div>
  <!-- Écran de préparation : le clic sur le bouton est ce qui autorise le son pour la session -->
  <div id="unlock" hidden>
    <div id="step-sound" class="card">
      <h1 data-i18n="setupTitle"></h1>
      <p data-i18n="setupClick"></p>
      <button id="allow" data-i18n="unlock"></button>
    </div>
    <!-- Ensuite, la première fois : ranger l'onglet hors de la barre d'onglets, ou le garder -->
    <div id="step-hide" class="card" hidden>
      <h1 data-i18n="hideTitle"></h1>
      <p data-i18n="hideWhy"></p>
      <p data-i18n="hideHow"></p>
      <p class="help" data-i18n="setupHide"></p>
      <div class="choices">
        <button id="hide-yes" data-i18n="hideYes"></button>
        <button id="hide-no" class="secondary" data-i18n="hideNo"></button>
      </div>
    </div>
  </div>
  <!-- Versions à incrémenter à chaque modification (cache de GitHub Pages) -->
  <script src="../common/i18n-core.js?v=5"></script>
  <script src="player.js?v=17"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
